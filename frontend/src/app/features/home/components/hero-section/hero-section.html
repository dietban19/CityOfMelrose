<section class="hero">
  <div
    class="hero__image"
    [style.background-image]="
      imageUrl()
        ? 'url(&quot;' + imageUrl() + '&quot;)'
        : null
    "
    role="img"
    [attr.aria-label]="imageAlt() || null"
  ></div>
    <div class="hero__overlay">

  <div class="hero__search-card">
    <label
      class="hero__search-label"
      for="site-search"
    >
      What can we help you find?
    </label>

    <div class="hero__search-row">
      <input
        id="site-search"
        class="hero__search-input"
        type="search"
        placeholder="Find services, bylaws and more..."
      />

      <button
        class="hero__search-button"
        type="button"
        aria-label="Search"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M10.5 4a6.5 6.5 0 1 0 4.05 11.58L19.97 21 21 19.97l-5.42-5.42A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"
          />
        </svg>
      </button>
    </div>
  </div>
    </div>
</section>
